name: Contracts

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    name: Test (Rust 1.81)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Terra's wasmvm 2.2 rejects Wasm built with Rust >= 1.82, so we test on 1.81.
      - uses: dtolnay/rust-toolchain@1.81.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Build optimized Wasm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # optimizer 0.16.1 = Rust 1.81. Don't bump to 0.17+: its output needs CosmWasm 3 on chain.
      - name: Optimize
        run: |
          docker run --rm -v "$(pwd)":/code \
            --mount type=volume,source="contracts_cache",target=/target \
            --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
            cosmwasm/optimizer:0.16.1
          ls -la artifacts
          cat artifacts/checksums.txt
      - uses: dtolnay/rust-toolchain@1.81.0
      - name: Check Wasm against Terra's capabilities
        run: |
          cargo install cosmwasm-check --version "~2.2" --locked
          cosmwasm-check \
            --available-capabilities iterator,staking,stargate,cosmwasm_1_1,cosmwasm_1_2,cosmwasm_1_3,cosmwasm_1_4,token_factory \
            artifacts/*.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: |
            contracts/artifacts/*.wasm
            contracts/artifacts/checksums.txt
          if-no-files-found: error
