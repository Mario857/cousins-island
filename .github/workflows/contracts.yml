name: Contracts

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    name: Test (Rust 1.81)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Terra's wasmvm 2.2 rejects Wasm built with Rust >= 1.82, so we test on 1.81.
      - uses: dtolnay/rust-toolchain@1.81.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Build Wasm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tools are built with current stable Rust; the contracts with 1.81 below.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cosmwasm-check
        run: cargo +stable install cosmwasm-check --version "~2.2" --locked
      - name: Install wasm-opt
        run: npm install --global binaryen@123 && wasm-opt --version
      # Rust 1.81 is the newest toolchain whose Wasm output Terra's wasmvm 2.2 accepts
      # (1.82+ turns on reference-types, which wasmvm 2.2 rejects).
      - uses: dtolnay/rust-toolchain@1.81.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Compile
        env:
          RUSTFLAGS: "-C link-arg=-s"
        run: cargo +1.81.0 build --locked --release --lib --target wasm32-unknown-unknown -p cousins-marketplace -p cousins-nft
      - name: Optimize
        run: |
          mkdir -p artifacts
          for name in cousins_marketplace cousins_nft; do
            # Only the Wasm features wasmvm 2.2 accepts (no bulk-memory / reference-types).
            wasm-opt -Os --strip-debug --strip-producers \
              --mvp-features --enable-sign-ext --enable-mutable-globals \
              --enable-nontrapping-float-to-int --enable-multivalue \
              "target/wasm32-unknown-unknown/release/$name.wasm" -o "artifacts/$name.wasm"
          done
          (cd artifacts && sha256sum *.wasm > checksums.txt && ls -la && cat checksums.txt)
      - name: Check Wasm against Terra's capabilities
        run: |
          cosmwasm-check \
            --available-capabilities iterator,staking,stargate,cosmwasm_1_1,cosmwasm_1_2,cosmwasm_1_3,cosmwasm_1_4,token_factory \
            artifacts/*.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: |
            contracts/artifacts/*.wasm
            contracts/artifacts/checksums.txt
          if-no-files-found: error
